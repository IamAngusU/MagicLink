<!doctype html>
<html lang="en">
<body style="margin:0;background:#eef4f3;color:#142024;font-family:Arial,sans-serif">
  <div style="max-width:560px;margin:0 auto;padding:48px 24px">
    <div style="background:#fff;border:1px solid #cbd8d6;padding:36px">
      <p style="margin:0 0 28px;font-size:13px;color:#43615f">{{app_name}}</p>
      <h1 style="font-size:30px;line-height:1.15;margin:0 0 16px">Your secure sign-in link</h1>
      <p style="font-size:16px;line-height:1.6;margin:0 0 28px">Open the link to sign in. It can be used once and expires after {{expires_minutes}} minutes.</p>
      <p style="margin:0"><a href="{{magic_link}}" style="display:inline-block;background:#087982;color:#fff;text-decoration:none;padding:14px 20px;border-radius:4px">Sign in securely</a></p>
      <p style="font-size:12px;line-height:1.5;color:#607775;margin:28px 0 0;word-break:break-all"><a href="{{magic_link}}" style="color:#43615f">{{magic_link}}</a></p>
      <p style="font-size:12px;line-height:1.5;color:#607775;margin:16px 0 0">{{recipient}}</p>
      <p style="font-size:12px;line-height:1.5;color:#607775;margin:12px 0 0">If you did not request this link, you can safely ignore this email.</p>
    </div>
  </div>
</body>
</html>
