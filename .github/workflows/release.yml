name: Release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, openssl, sodium
          coverage: none
      - run: php bin/check.php
      - name: Build shared-hosting ZIP
        run: |
          mkdir -p dist/package
          rsync -a ./ dist/package/ \
            --exclude .git \
            --exclude .github \
            --exclude dist \
            --exclude .env \
            --exclude 'storage/*'
          mkdir -p dist/package/storage
          cp storage/.gitkeep storage/.htaccess dist/package/storage/
          (cd dist/package && zip -qr ../magiclink-shared-hosting.zip .)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: magiclink-release
          path: dist/magiclink-shared-hosting.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: magiclink-release
          path: dist
      - name: Publish private release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/magiclink-shared-hosting.zip --generate-notes --title "MagicLink ${GITHUB_REF_NAME}"
