name: Build release proof

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    if: github.repository == 'angusu-de/MagicLink-CI'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, openssl, sodium
          coverage: none
      - run: php bin/check.php
      - name: Build shared-hosting ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          rsync -a ./ dist/package/ \
            --exclude .git \
            --exclude .github \
            --exclude dist \
            --exclude .env \
            --exclude 'storage/*'
          mkdir -p dist/package/storage
          cp storage/.gitkeep storage/.htaccess dist/package/storage/
          (cd dist/package && zip -qr ../magiclink-shared-hosting.zip .)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: magiclink-release-proof
          path: dist/magiclink-shared-hosting.zip
          if-no-files-found: error
          retention-days: 7
