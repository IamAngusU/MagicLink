name: CI

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit from the private IamAngusU/MagicLink repository
        required: true
        type: string

permissions: {}

concurrency:
  group: magiclink-ci-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  php:
    if: github.repository == 'angusu-de/MagicLink-CI'
    name: PHP ${{ matrix.php }} · SQLite
    environment: private-source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IamAngusU/MagicLink
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.MAGICLINK_DEPLOY_KEY }}
          persist-credentials: false
      - name: Verify immutable source revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, openssl, sodium
          coverage: none
      - run: php bin/check.php

  mysql:
    if: github.repository == 'angusu-de/MagicLink-CI'
    name: PHP 8.4 · MySQL 8.4
    environment: private-source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_DATABASE: magic_link_test
          MYSQL_USER: magic_link
          MYSQL_PASSWORD: test-only-password
          MYSQL_ROOT_PASSWORD: test-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IamAngusU/MagicLink
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.MAGICLINK_DEPLOY_KEY }}
          persist-credentials: false
      - name: Verify immutable source revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, openssl, sodium
          coverage: none
      - run: php bin/check.php
        env:
          MAGICLINK_TEST_DB_DRIVER: mysql
          MAGICLINK_TEST_DB_HOST: 127.0.0.1
          MAGICLINK_TEST_DB_PORT: "3306"
          MAGICLINK_TEST_DB_DATABASE: magic_link_test
          MAGICLINK_TEST_DB_USERNAME: magic_link
          MAGICLINK_TEST_DB_PASSWORD: test-only-password

  package:
    if: github.repository == 'angusu-de/MagicLink-CI'
    name: Source ${{ inputs.source_sha }} · package
    environment: private-source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IamAngusU/MagicLink
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.MAGICLINK_DEPLOY_KEY }}
          persist-credentials: false
      - name: Verify immutable source revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, openssl, sodium
          coverage: none
      - run: php bin/check.php
      - name: Build and inspect private package without publishing it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          rsync -a ./ dist/package/ \
            --exclude .git \
            --exclude .github \
            --exclude dist \
            --exclude .env \
            --exclude 'storage/*'
          mkdir -p dist/package/storage
          cp storage/.gitkeep storage/.htaccess dist/package/storage/
          (cd dist/package && zip -qr ../magiclink-shared-hosting.zip .)
          zipinfo -1 dist/magiclink-shared-hosting.zip > dist/contents.txt
          ! grep -E '(^|/)\.git($|/)|(^|/)\.env$' dist/contents.txt
          test -f dist/package/public/index.php
          test -f dist/package/.env.example

  workflow-security:
    if: github.repository == 'angusu-de/MagicLink-CI'
    name: Workflow security
    environment: private-source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IamAngusU/MagicLink
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.MAGICLINK_DEPLOY_KEY }}
          persist-credentials: false
      - name: Verify immutable source revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Audit GitHub Actions
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          online-audits: false
          persona: auditor
          min-severity: medium
          min-confidence: medium
          version: v1.30.1
